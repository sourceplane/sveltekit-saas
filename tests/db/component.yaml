apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: db-tests
  description: The migrations' tests (the manifest, upstream's two migrations byte for byte, and the schema they leave on a Supabase-shaped Postgres in process — the profile trigger, the bucket and row-level security)
spec:
  type: turbo-package
  lifecycle: production
  owner: platform
  domain: tests
  subscribe:
    environments:
      - name: dev
        profile: quick-check
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"
    buildCommand: pnpm exec turbo run build --filter=./
    typecheckCommand: pnpm exec turbo run typecheck --filter=./
    preBuildCommand: pnpm exec turbo run test --filter=./
  labels:
    team: platform
    layer: test
